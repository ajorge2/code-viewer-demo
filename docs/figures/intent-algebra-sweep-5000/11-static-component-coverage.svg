<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">Static component coverage on unseen repositories</title>
<desc id="desc">Repository-disjoint exploratory holdout; commit text withheld and unmatched files remain explicit gaps</desc>
