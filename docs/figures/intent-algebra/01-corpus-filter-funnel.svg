<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Corpus screening funnel by language</title>
<desc id="desc">Full-corpus row counts before and after deterministic, non-AST noise filters</desc>
<rect width="1400" height="820" fill="#ffffff"/>
<style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:31px;font-weight:700;fill:#172033}.subtitle{font-size:17px;fill:#667085}.axis{font-size:15px;fill:#667085}.label{font-size:18px;fill:#172033}.value{font-size:18px;font-weight:700}.note{font-size:14px;fill:#667085}</style>
<text x="70.0" y="65.0" text-anchor="start" class="title">Corpus screening funnel by language</text>
<text x="70.0" y="98.0" text-anchor="start" class="subtitle">Full-corpus row counts before and after deterministic, non-AST noise filters</text>
<text x="70.0" y="150.0" text-anchor="start" class="label" style="fill:#172033;font-weight:700;font-size:18px">Full corpus (not a sample)</text>
<text x="251.0" y="259.0" text-anchor="end" class="label" style="font-weight:700;font-size:20px">Python</text>
<rect x="275.0" y="225.0" width="1005.0" height="65.0" fill="#e8edf5" rx="7.0"/>
<rect x="275.0" y="225.0" width="741.4" height="65.0" fill="#2563eb" rx="7.0"/>
<text x="290.0" y="266.0" text-anchor="start" class="label" style="fill:#ffffff;font-weight:700;font-size:18px">41,333 retained</text>
<text x="1280.0" y="213.0" text-anchor="end" class="label" style="fill:#172033;font-weight:700;font-size:17px">56,025 raw rows</text>
<text x="1280.0" y="318.0" text-anchor="end" class="axis">73.8% retained</text>
<text x="275.0" y="318.0" text-anchor="start" class="axis">Rows surviving non-AST noise filters</text>
<text x="251.0" y="489.0" text-anchor="end" class="label" style="font-weight:700;font-size:20px">JavaScript</text>
<rect x="275.0" y="455.0" width="950.5" height="65.0" fill="#e8edf5" rx="7.0"/>
<rect x="275.0" y="455.0" width="911.2" height="65.0" fill="#d97706" rx="7.0"/>
<text x="290.0" y="496.0" text-anchor="start" class="label" style="fill:#ffffff;font-weight:700;font-size:18px">50,794 retained</text>
<text x="1225.5" y="443.0" text-anchor="end" class="label" style="fill:#172033;font-weight:700;font-size:17px">52,989 raw rows</text>
<text x="1225.5" y="548.0" text-anchor="end" class="axis">95.9% retained</text>
<text x="275.0" y="548.0" text-anchor="start" class="axis">Rows surviving non-AST noise filters</text>
<rect x="70.0" y="670.0" width="1260.0" height="85.0" fill="#f7f9fc" rx="10.0" stroke="#d7dde7" stroke-width="1"/>
<text x="95.0" y="705.0" text-anchor="start" class="label" style="font-weight:700">Combined: 92,127 / 109,014 rows retained (84.5%)</text>
<text x="95.0" y="735.0" text-anchor="start" class="note">16,887 rows excluded. Reason totals are corpus-wide; the artifact does not break them down by language.</text>
